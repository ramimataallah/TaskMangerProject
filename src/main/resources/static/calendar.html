<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TaskFlow · Calendar</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">✦</span>
                <span class="logo-text">TaskFlow</span>
            </div>
            <nav class="nav-links">
                <a href="index.html">📋 Tasks</a>
                <a href="analytics.html">📊 Analytics</a>
                <a href="calendar.html" class="active">📅 Calendar</a>
                <a href="categories.html">🏷️ Categories</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="calendar-header">
            <h1 class="section-title" style="font-size: 28px;">📅 Task Calendar</h1>
            <div class="calendar-nav">
                <button class="btn btn-secondary" onclick="previousMonth()">← Previous</button>
                <h2 id="monthYearDisplay" style="min-width: 200px; text-align: center;"></h2>
                <button class="btn btn-secondary" onclick="nextMonth()">Next →</button>
            </div>
        </div>
        
        <div class="calendar-grid">
            <div class="weekdays">
                <div class="weekday">Sun</div>
                <div class="weekday">Mon</div>
                <div class="weekday">Tue</div>
                <div class="weekday">Wed</div>
                <div class="weekday">Thu</div>
                <div class="weekday">Fri</div>
                <div class="weekday">Sat</div>
            </div>
            <div class="calendar-days" id="calendarDays"></div>
        </div>
        
        <div class="info-text" style="margin-top: 24px; text-align: center; color: var(--text-muted); font-size: 13px;">
            💡 Tip: Click on any task to see its details
        </div>
    </main>

    <div id="toast" class="toast"></div>
    
            <!-- Calendar create modal -->
            <div id="calendarCreateModal" class="modal-overlay" style="display:none;">
                <div class="modal-card">
                    <h3 class="modal-title">➕ Create Task for selected day</h3>
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="calendarTaskTitle" />
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="calendarTaskDescription" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Due Date & Time</label>
                        <input type="datetime-local" id="calendarTaskDueDate" />
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="calendarTaskCategory" class="category-select"><option value="">-- Select a category --</option></select>
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="document.getElementById('calendarCreateModal').style.display='none'">Cancel</button>
                        <button class="btn btn-primary" onclick="submitCalendarTask()">Create Task</button>
                    </div>
                </div>
            </div>
    
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadCalendar === 'function') loadCalendar();
            if (typeof loadCategories === 'function') loadCategories();
        });
    </script>
</body>
</html>
