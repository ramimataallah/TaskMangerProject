<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TaskFlow · Task Manager</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .category-select {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            width: 100%;
            cursor: pointer;
        }
        
        .task-category-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
            width: fit-content;
        }
        
        .category-filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        
        .filter-cat-btn {
            padding: 6px 16px;
            border-radius: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        
        .filter-cat-btn.active {
            background: var(--accent);
            color: #000;
        }
        
        .filter-cat-btn .cat-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .refresh-btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 12px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">✦</span>
                <span class="logo-text">TaskFlow</span>
            </div>
            <nav class="nav-links">
                <a href="index.html" class="active">📋 Tasks</a>
                <a href="analytics.html">📊 Analytics</a>
                <a href="calendar.html">📅 Calendar</a>
                <a href="categories.html">🏷️ Categories</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="form-section">
            <h2 class="section-title">New Task</h2>
            <div class="card">
                <div class="form-group">
                    <label for="taskTitle">Title <span class="required">*</span></label>
                    <input type="text" id="taskTitle" placeholder="e.g., Complete Math homework" />
                </div>
                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" rows="3" placeholder="Add details about this task..."></textarea>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="taskCategory" class="category-select">
                        <option value="">-- Select a category --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="taskDueDate">Due date</label>
                    <input type="datetime-local" id="taskDueDate" />
                </div>
                <button class="btn btn-primary" onclick="createTask()">➕ Add Task</button>
            </div>
        </section>

        <section class="tasks-section">
            <div class="tasks-header">
                <h2 class="section-title">My Tasks</h2>
                <div class="task-stats">
                    <span id="totalCount" class="stat-badge">0 total</span>
                    <span id="doneCount" class="stat-badge">0 done</span>
                </div>
            </div>
            
            <div class="category-filter-bar" id="categoryFilterBar">
                <button class="filter-cat-btn active" data-cat="all" onclick="filterTasksByCategory('all')">📋 All Tasks</button>
            </div>

            <div id="emptyState" class="empty-state">
                <div class="empty-icon">📋</div>
                <p>No tasks yet. Add one above!</p>
            </div>

            <div id="taskList" class="task-list"></div>
        </section>
    </main>

    <div id="toast" class="toast"></div>

    <div id="editModal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <h3 class="modal-title">✏️ Edit Task</h3>
            <input type="hidden" id="editId" />
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="editTitle" />
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="editDescription" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="editCategory" class="edit-category-select">
                    <option value="">-- Select a category --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="editDueDate">Due date</label>
                <input type="datetime-local" id="editDueDate" />
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        const API_BASE = 'http://localhost:8081/api/tasks';
        let currentCategoryFilter = 'all';
        let categoriesList = [];
        
        // Stockage local des catégories des tâches (solution temporaire)
        let taskCategories = {}; // { taskId: categoryId }

        // ==================== CHARGEMENT DES CATEGORIES ====================
        
        function loadCategories() {
            const saved = localStorage.getItem('task_categories');
            
            if (saved && saved !== 'undefined' && saved !== 'null') {
                try {
                    categoriesList = JSON.parse(saved);
                } catch(e) {
                    categoriesList = [];
                }
            }
            
            if (categoriesList.length === 0) {
                categoriesList = [
                    { id: 1, name: 'School', color: '#2ea043' },
                    { id: 2, name: 'Personal', color: '#f0a500' },
                    { id: 3, name: 'Work', color: '#f85149' }
                ];
                localStorage.setItem('task_categories', JSON.stringify(categoriesList));
            }
            
            // Charger les associations tâche-catégorie depuis localStorage
            const savedTaskCats = localStorage.getItem('task_categories_mapping');
            if (savedTaskCats) {
                try {
                    taskCategories = JSON.parse(savedTaskCats);
                } catch(e) {
                    taskCategories = {};
                }
            }
            
            return categoriesList;
        }

        function saveTaskCategoryMapping() {
            localStorage.setItem('task_categories_mapping', JSON.stringify(taskCategories));
        }

        function loadCategoryComboBox() {
            loadCategories();
            const combo = document.getElementById('taskCategory');
            if (!combo) return;
            
            combo.innerHTML = '<option value="">-- Select a category --</option>';
            
            categoriesList.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat.id;
                option.textContent = cat.name;
                combo.appendChild(option);
            });
        }

        function loadCategoryFilterBar() {
            loadCategories();
            const container = document.getElementById('categoryFilterBar');
            if (!container) return;
            
            while (container.children.length > 1) {
                container.removeChild(container.lastChild);
            }
            
            categoriesList.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-cat-btn';
                btn.setAttribute('data-cat', cat.id);
                btn.innerHTML = `<span class="cat-dot" style="background: ${cat.color};"></span> ${escapeHtml(cat.name)}`;
                btn.onclick = () => filterTasksByCategory(cat.id);
                container.appendChild(btn);
            });
        }

        // ==================== FILTRAGE DES TÂCHES ====================
        
        async function filterTasksByCategory(catId) {
            currentCategoryFilter = catId;
            
            document.querySelectorAll('.filter-cat-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            let activeBtn;
            if (catId === 'all') {
                activeBtn = document.querySelector('.filter-cat-btn[data-cat="all"]');
            } else {
                activeBtn = document.querySelector(`.filter-cat-btn[data-cat="${catId}"]`);
            }
            if (activeBtn) activeBtn.classList.add('active');
            
            await loadTasksWithFilter();
        }

        async function loadTasksWithFilter() {
            try {
                const response = await fetch(API_BASE);
                let tasks = await response.json();
                
                // Charger les mappings sauvegardés
                loadCategories();
                
                // Appliquer le filtre de catégorie
                let filteredTasks = tasks;
                if (currentCategoryFilter !== 'all') {
                    const filterId = parseInt(currentCategoryFilter);
                    filteredTasks = tasks.filter(task => {
                        // Vérifier d'abord dans le mapping localStorage, puis dans task.categoryId
                        const taskCatId = taskCategories[task.id] || task.categoryId;
                        return taskCatId === filterId;
                    });
                }
                
                renderTasksWithCategories(filteredTasks, tasks);
                
            } catch (error) {
                console.error('Error loading tasks:', error);
                showToast('Could not connect to server', 'error');
            }
        }

        // ==================== AFFICHAGE DES TÂCHES ====================
        
        function renderTasksWithCategories(tasks, allTasks) {
            const listEl = document.getElementById('taskList');
            const emptyEl = document.getElementById('emptyState');
            const totalCount = document.getElementById('totalCount');
            const doneCount = document.getElementById('doneCount');

            if (!listEl) return;

            const doneTotal = tasks.filter(t => t.completed).length;
            if (totalCount) totalCount.textContent = `${allTasks?.length || tasks.length} total`;
            if (doneCount) doneCount.textContent = `${doneTotal} done`;
            if (emptyEl) emptyEl.style.display = tasks.length === 0 ? 'block' : 'none';
            
            listEl.innerHTML = '';

            if (tasks.length === 0) {
                if (currentCategoryFilter !== 'all') {
                    const categoryName = categoriesList.find(c => c.id == currentCategoryFilter)?.name || 'this category';
                    listEl.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><p>No tasks in ${categoryName} category.<br>Add a new task with this category!</p></div>`;
                }
                return;
            }

            tasks.forEach((task, index) => {
                // Récupérer la catégorie depuis le mapping ou depuis task.categoryId
                const taskCategoryId = taskCategories[task.id] || task.categoryId;
                const category = categoriesList.find(c => c.id == taskCategoryId);
                
                const card = document.createElement('div');
                card.className = `task-card ${task.completed ? 'completed' : ''}`;
                card.innerHTML = `
                    <div class="task-number">${index + 1}</div>
                    <div class="task-content">
                        <div class="task-title">${escapeHtml(task.title)}</div>
                        ${task.description ? `<div class="task-description">${escapeHtml(task.description)}</div>` : ''}
                        ${task.dueDate ? `<div class="task-due">Due: ${new Date(task.dueDate).toLocaleString()}</div>` : ''}
                        ${category ? `<div class="task-category-badge" style="background: ${category.color}20; border: 1px solid ${category.color};">
                            <span style="color: ${category.color};">●</span> ${escapeHtml(category.name)}
                        </div>` : '<div class="task-category-badge" style="background: #333; border: 1px solid #666;"><span>📁</span> No category</div>'}
                        ${task.completed ? '<span class="completed-badge">✔ Done</span>' : ''}
                    </div>
                    <div class="task-actions">
                        <button class="btn btn-success btn-sm" onclick="toggleTask(${task.id}, ${task.completed})">
                            ${task.completed ? 'Undo' : '✓ Done'}
                        </button>
                        <button class="btn btn-secondary btn-sm" onclick='openEditModal(${task.id}, "${escapeForAttr(task.title)}", "${escapeForAttr(task.description || '')}", ${taskCategoryId || 'null'}, ${task.dueDate ? '"' + escapeForAttr(task.dueDate) + '"' : 'null'})'>
                            Edit
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="deleteTask(${task.id})">
                            Delete
                        </button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // ==================== CRUD TÂCHES AVEC CATÉGORIE ====================
        
        async function createTask() {
            const titleInput = document.getElementById('taskTitle');
            const descInput = document.getElementById('taskDescription');
            const categorySelect = document.getElementById('taskCategory');
            
            const title = titleInput?.value.trim();
            const description = descInput?.value.trim();
            let categoryId = categorySelect?.value;
            categoryId = categoryId ? parseInt(categoryId) : null;

            if (!title) {
                showToast('Please enter a task title!', 'error');
                titleInput?.focus();
                return;
            }

            const dueDate = document.getElementById('taskDueDate')?.value || null;

            const newTask = { 
                title, 
                description, 
                completed: false,
                dueDate: dueDate
            };
            
            console.log('Creating task with categoryId (local):', categoryId);

            try {
                const response = await fetch(API_BASE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newTask)
                });

                if (!response.ok) throw new Error('Failed to create task');
                
                const createdTask = await response.json();
                console.log('Task created:', createdTask);
                
                // Sauvegarder l'association catégorie dans localStorage
                if (categoryId) {
                    taskCategories[createdTask.id] = categoryId;
                    saveTaskCategoryMapping();
                    console.log(`Category ${categoryId} saved for task ${createdTask.id}`);
                }

                if (titleInput) titleInput.value = '';
                if (descInput) descInput.value = '';
                if (categorySelect) categorySelect.value = '';
                const dueInput = document.getElementById('taskDueDate'); if (dueInput) dueInput.value = '';

                showToast('✓ Task added successfully!', 'success');
                await loadTasksWithFilter();
            } catch (error) {
                console.error('Error creating task:', error);
                showToast('Failed to add task', 'error');
            }
        }

        async function toggleTask(id, currentCompleted) {
            try {
                const getResp = await fetch(`${API_BASE}/${id}`);
                const task = await getResp.json();
                
                const updatedTask = {
                    title: task.title,
                    description: task.description,
                    completed: !currentCompleted,
                    dueDate: task.dueDate
                };
                
                await fetch(`${API_BASE}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedTask)
                });
                
                showToast(!currentCompleted ? '✓ Task completed!' : 'Task undone', 'success');
                await loadTasksWithFilter();
            } catch (error) {
                showToast('Failed to update task', 'error');
            }
        }

        async function deleteTask(id) {
            if (!confirm('Delete this task?')) return;
            try {
                await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
                // Supprimer aussi l'association catégorie
                delete taskCategories[id];
                saveTaskCategoryMapping();
                showToast('Task deleted', 'success');
                await loadTasksWithFilter();
            } catch (error) {
                showToast('Failed to delete task', 'error');
            }
        }

        function openEditModal(id, title, description, categoryId, dueDate) {
            document.getElementById('editId').value = id;
            document.getElementById('editTitle').value = title;
            document.getElementById('editDescription').value = description;
            const editDue = document.getElementById('editDueDate');
            if (editDue) editDue.value = dueDate ? (dueDate.length > 16 ? dueDate.substring(0,16) : dueDate) : '';
            
            loadCategories();
            const combo = document.getElementById('editCategory');
            combo.innerHTML = '<option value="">-- Select a category --</option>';
            
            categoriesList.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat.id;
                option.textContent = cat.name;
                if (categoryId == cat.id) option.selected = true;
                combo.appendChild(option);
            });
            
            document.getElementById('editModal').style.display = 'flex';
        }

        async function saveEdit() {
            const id = document.getElementById('editId').value;
            const title = document.getElementById('editTitle').value.trim();
            const description = document.getElementById('editDescription').value.trim();
            let categoryId = document.getElementById('editCategory').value;
            categoryId = categoryId ? parseInt(categoryId) : null;
            const dueDate = document.getElementById('editDueDate')?.value || null;
            
            if (!title) {
                showToast('Title cannot be empty!', 'error');
                return;
            }
            
            try {
                const getResp = await fetch(`${API_BASE}/${id}`);
                const existing = await getResp.json();
                
                await fetch(`${API_BASE}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...existing, title, description, dueDate })
                });
                
                // Mettre à jour l'association catégorie
                if (categoryId) {
                    taskCategories[id] = categoryId;
                } else {
                    delete taskCategories[id];
                }
                saveTaskCategoryMapping();
                
                closeModal();
                showToast('✓ Task updated!', 'success');
                await loadTasksWithFilter();
            } catch (error) {
                showToast('Failed to save changes', 'error');
            }
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // ==================== UTILITIES ====================
        
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        function escapeForAttr(str) {
            if (!str) return '';
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ');
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ==================== INITIALISATION ====================
        
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Page initialized');
            loadCategories();
            loadCategoryComboBox();
            loadCategoryFilterBar();
            loadTasksWithFilter();
        });

        // Rafraîchir toutes les 3 secondes
        setInterval(() => {
            loadTasksWithFilter();
        }, 3000);
    </script>
</body>
</html>
