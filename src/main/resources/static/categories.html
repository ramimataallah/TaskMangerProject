<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TaskFlow · Categories</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">✦</span>
                <span class="logo-text">TaskFlow</span>
            </div>
            <nav class="nav-links">
                <a href="index.html">📋 Tasks</a>
                <a href="analytics.html">📊 Analytics</a>
                <a href="calendar.html">📅 Calendar</a>
                <a href="categories.html" class="active">🏷️ Categories</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <h1 class="section-title" style="font-size: 28px; margin-bottom: 32px;">🏷️ Task Categories</h1>
        
        <div class="categories-layout">
            <!-- Left Column: Create Category -->
            <div>
                <div class="category-form-card">
                    <h3>➕ Create New Category</h3>
                    <div class="form-group">
                        <label>Category Name</label>
                        <input type="text" id="newCategoryName" placeholder="e.g., Homework, Sports, Reading" />
                    </div>
                    <div class="form-group">
                        <label>Choose Color</label>
                        <div class="color-options">
                            <div class="color-option" style="background: #2ea043;" onclick="selectColor('#2ea043')"></div>
                            <div class="color-option" style="background: #f0a500;" onclick="selectColor('#f0a500')"></div>
                            <div class="color-option" style="background: #f85149;" onclick="selectColor('#f85149')"></div>
                            <div class="color-option" style="background: #58a6ff;" onclick="selectColor('#58a6ff')"></div>
                            <div class="color-option" style="background: #a371f7;" onclick="selectColor('#a371f7')"></div>
                            <div class="color-option" style="background: #3fb950;" onclick="selectColor('#3fb950')"></div>
                            <div class="color-option" style="background: #d2a8ff;" onclick="selectColor('#d2a8ff')"></div>
                            <div class="color-option" style="background: #ff7b72;" onclick="selectColor('#ff7b72')"></div>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="addCategory()">Create Category</button>
                </div>
                
                <div class="category-list-card" style="margin-top: 24px;">
                    <h3>📁 Your Categories</h3>
                    <div id="categoryList">
                        <div class="empty-state" style="padding: 20px;">
                            <p>Loading categories...</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Right Column: Filter Tasks by Category -->
            <div>
                <div class="category-list-card">
                    <h3>🔍 Filter Tasks by Category</h3>
                    <div class="filter-buttons" id="filterButtons">
                        <div class="filter-chip active" data-category="all" onclick="filterByCategory('all', this)">All Tasks</div>
                    </div>
                    <div id="categoryTasksList">
                        <div class="empty-state" style="padding: 20px;">
                            <p>Select a category to see tasks</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>
    
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadCategories();
            loadTasksWithCategories();
            selectColor('#f0a500');
        });
    </script>
</body>
</html>
